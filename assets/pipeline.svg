<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="1" stop-color="#130a24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4b5fd"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff5f7e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ade80"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .t { font-size: 16px; font-weight: 700; fill: #f5f0ff; }
      .s { font-size: 11.5px; fill: #8b84a8; }
      .flow { fill: none; stroke: #c4b5fd; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
      .fail { fill: none; stroke: #ff5f7e; stroke-width: 2; stroke-dasharray: 4 6; animation: dash 0.8s linear infinite; }
      .ok { fill: none; stroke: #4ade80; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
      .blinkR { animation: blink 1.6s ease-in-out infinite; }
      .blinkG { animation: blink 1.6s ease-in-out 0.8s infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="1100" height="380" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1099" height="379" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="30" y="26" class="mono" font-size="12" fill="#8b84a8" letter-spacing="2">AI VOICE RECEPTIONIST  ·  CALL FLOW</text>

  <!-- traveling packet (sits under the nodes) -->
  <circle r="7" fill="#ff7aa2" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" path="M115 77 H975 V287 H115 Z"/>
  </circle>
  <circle r="5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="9s" begin="4.5s" repeatCount="indefinite" path="M115 77 H975 V287 H115 Z"/>
  </circle>

  <!-- connectors row 1 -->
  <path class="flow" d="M200 77 H240" marker-end="url(#arrow)"/>
  <path class="flow" d="M415 77 H455" marker-end="url(#arrow)"/>
  <path class="flow" d="M630 77 H670" marker-end="url(#arrow)"/>
  <path class="flow" d="M845 77 H885" marker-end="url(#arrow)"/>
  <!-- run to test -->
  <path class="flow" d="M1010 109 V250" marker-end="url(#arrow)"/>
  <!-- test fail to repair, repair back to run -->
  <path class="fail" d="M930 255 V205 Q930 170 900 170 H825" marker-end="url(#arrowR)"/>
  <path class="fail" d="M760 150 V130 H940 V113" marker-end="url(#arrowR)"/>
  <!-- row 2, right to left -->
  <path class="ok" d="M890 287 H850" marker-end="url(#arrowG)"/>
  <path class="flow" d="M675 287 H635" marker-end="url(#arrow)"/>
  <path class="flow" d="M460 287 H420" marker-end="url(#arrow)"/>
  <!-- back to chat -->
  <path class="flow" d="M245 287 H115 V113" marker-end="url(#arrow)"/>

  <!-- row 1 nodes -->
  <g transform="translate(30 45)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#ff7aa2" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Incoming Call</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">Twilio · SIP</text>
  </g>
  <g transform="translate(245 45)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">AI Receptionist</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">realtime voice</text>
  </g>
  <g transform="translate(460 45)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#ff7aa2" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Intent Detect</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">book · ask · route</text>
  </g>
  <g transform="translate(675 45)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Check Slots</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">n8n webhook</text>
  </g>
  <g transform="translate(890 45)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#ff7aa2" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Confirm Time</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">caller agrees</text>
  </g>

  <!-- repair -->
  <g transform="translate(700 150)">
    <rect width="120" height="40" rx="20" fill="#2a0d18" stroke="#ff5f7e"/>
    <text x="60" y="25" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#ff8fab">NEW SLOT</text>
  </g>
  <g class="blinkR" transform="translate(942 222)">
    <text class="mono" font-size="11" font-weight="700" fill="#ff5f7e">TAKEN</text>
  </g>

  <!-- row 2 nodes -->
  <g transform="translate(890 255)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Book It</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">Google Calendar</text>
  </g>
  <g transform="translate(675 255)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#4ade80" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Call Report</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">summary + transcript</text>
  </g>
  <g transform="translate(460 255)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#ff7aa2" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Owner Inbox</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">email · sheet</text>
  </g>
  <g transform="translate(245 255)">
    <rect width="170" height="64" rx="14" fill="#160d2a" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="85" y="28" text-anchor="middle" class="t">Follow Up</text>
    <text x="85" y="47" text-anchor="middle" class="s mono">SMS · next call</text>
  </g>
  <g class="blinkG" transform="translate(850 345)">
    <text class="mono" font-size="11" font-weight="700" fill="#4ade80">BOOKED</text>
  </g>
</svg>
